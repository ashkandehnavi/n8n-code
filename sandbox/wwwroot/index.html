<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سندباکس C#</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14110d;
      --paper: #f4efe4;
      --panel: #fffaf1;
      --line: #d9cbb3;
      --mute: #6f6454;
      --copper: #b45a1e;
      --copper-deep: #8a3e10;
      --ok: #2f6b45;
      --bad: #a33b2a;
      --code: #1c1915;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 500px at 100% -10%, #f7d9b8 0%, transparent 50%),
        var(--paper);
      color: var(--ink);
      font-family: Vazirmatn, Tahoma, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      padding: 28px 8vw 12px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
    .sub { color: var(--mute); margin-top: 6px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #c4b7a2; }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    main {
      padding: 12px 8vw 48px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
    }
    @media (max-width: 980px) {
      main, header { padding-inline: 16px; }
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(80, 50, 10, .06);
    }
    label { display: block; font-size: 13px; color: var(--mute); margin: 12px 0 6px; }
    input, select, textarea, button {
      font-family: inherit;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    textarea.code {
      width: 100%;
      min-height: 360px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: var(--code);
      color: #f3e6d2;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 13px;
      direction: ltr;
      text-align: left;
      resize: vertical;
      line-height: 1.5;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .primary { background: var(--copper); color: #fff; }
    .primary:hover { background: var(--copper-deep); }
    .ghost { background: #efe6d6; color: var(--ink); }
    .ghost:disabled, .primary:disabled { opacity: .55; cursor: wait; }
    pre {
      background: var(--code);
      color: #efe4d2;
      border-radius: 12px;
      padding: 12px;
      min-height: 90px;
      overflow: auto;
      direction: ltr;
      text-align: left;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .kvs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .pill {
      background: #efe6d6;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
    }
    .pill.ok { background: #dceee2; color: var(--ok); }
    .pill.bad { background: #f3dcd7; color: var(--bad); }
    a { color: var(--copper-deep); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>سندباکس اجرای C#</h1>
      <div class="sub">کد را اینجا بنویس، واقعاً بساز و اجرا کن. خروجی کنسول یا پاسخ HTTP وب‌اپ را می‌بینی.</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="health">در حال اتصال…</span></div>
  </header>
  <main>
    <section class="card">
      <label for="kind">نوع برنامه</label>
      <select id="kind">
        <option value="web" selected>وب‌اپ با UI</option>
        <option value="console">کنسول</option>
      </select>
      <label for="code">کد C#</label>
      <textarea id="code" class="code" spellcheck="false"></textarea>
      <div class="btns">
        <button class="primary" id="runBtn" type="button">ساخت و اجرا</button>
        <button class="ghost" id="sampleBtn" type="button">نمونه وب‌اپ</button>
        <button class="ghost" id="publishBtn" type="button">انتشار PR در GitHub</button>
      </div>
    </section>
    <section class="card">
      <div class="kvs" id="meta"></div>
      <label>stdout</label>
      <pre id="stdout">هنوز اجرا نشده.</pre>
      <label>stderr</label>
      <pre id="stderr">—</pre>
      <label>پاسخ HTTP (اگر وب‌اپ باشد)</label>
      <pre id="http">—</pre>
    </section>
  </main>
  <script>
    const WEB_SAMPLE = `var builder = WebApplication.CreateBuilder(args);
var app = builder.Build();
app.MapGet("/", () => Results.Content("""
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>سلام از سندباکس</title>
  <style>
    body { font-family: Tahoma, sans-serif; background:#f6f0e6; color:#1d1710; display:grid; place-items:center; min-height:100vh; margin:0; }
    main { background:#fff; padding:32px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.08); width:min(440px, 92vw); }
    h1 { margin-top:0; }
    button { background:#b45a1e; color:#fff; border:0; padding:10px 16px; border-radius:10px; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>وب‌اپ سندباکس</h1>
    <p>این صفحه از داخل Docker واقعاً سرو شده است.</p>
    <button onclick="document.getElementById('t').textContent = new Date().toLocaleString('fa-IR')">زمان را نشان بده</button>
    <p id="t"></p>
  </main>
</body>
</html>
""", "text/html; charset=utf-8"));
app.Run();`;

    const CONSOLE_SAMPLE = `Console.OutputEncoding = System.Text.Encoding.UTF8;
Console.WriteLine("سلام از سندباکس کنسول");
Console.WriteLine($"زمان UTC: {DateTime.UtcNow:O}");`;

    const $ = (id) => document.getElementById(id);
    $("code").value = WEB_SAMPLE;

    async function ping() {
      try {
        const r = await fetch("/health");
        const j = await r.json();
        $("dot").className = "dot " + (j.ok ? "ok" : "bad");
        $("health").textContent = j.ok ? ("آماده · " + (j.runtime || "net8")) : "قطع";
      } catch {
        $("dot").className = "dot bad";
        $("health").textContent = "قطع";
      }
    }

    function filesFromEditor() {
      const kind = $("kind").value;
      const files = { "Program.cs": $("code").value };
      if (kind === "web") {
        files["App.csproj"] = `<Project Sdk="Microsoft.NET.Sdk.Web">
  <PropertyGroup>
    <TargetFramework>net8.0</TargetFramework>
    <Nullable>enable</Nullable>
    <ImplicitUsings>enable</ImplicitUsings>
  </PropertyGroup>
</Project>
`;
      }
      return files;
    }

    function headers() {
      return { "Content-Type": "application/json" };
    }

    function showResult(j) {
      $("meta").innerHTML = "";
      const pills = [
        ["ok", j.ok],
        ["stage", j.stage],
        ["kind", j.kind],
        ["exit", j.exit_code],
        ["ms", j.duration_ms],
        ["run", j.run_id]
      ];
      for (const [k, v] of pills) {
        if (v === undefined || v === null || v === "") continue;
        const s = document.createElement("span");
        s.className = "pill" + (k === "ok" ? (j.ok ? " ok" : " bad") : "");
        s.textContent = k + ": " + v;
        $("meta").appendChild(s);
      }
      if (j.pr_url) {
        const a = document.createElement("a");
        a.href = j.pr_url;
        a.target = "_blank";
        a.textContent = "مشاهده PR";
        $("meta").appendChild(a);
      }
      if (j.error) {
        const s = document.createElement("span");
        s.className = "pill bad";
        s.textContent = j.error;
        $("meta").appendChild(s);
      }
      $("stdout").textContent = j.stdout || "—";
      $("stderr").textContent = j.stderr || "—";
      $("http").textContent = j.http_body || "—";
    }

    async function run() {
      $("runBtn").disabled = true;
      $("stdout").textContent = "در حال restore / build / run …";
      try {
        const r = await fetch("/execute", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({
            kind: $("kind").value,
            timeout_seconds: 60,
            files: filesFromEditor()
          })
        });
        showResult(await r.json());
      } catch (e) {
        showResult({ ok: false, error: String(e), stderr: String(e) });
      } finally {
        $("runBtn").disabled = false;
      }
    }

    async function publish() {
      $("publishBtn").disabled = true;
      try {
        const r = await fetch("/github/publish", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({
            title: "Sandbox web app",
            body: "Published from the sandbox UI.",
            files: filesFromEditor()
          })
        });
        showResult(await r.json());
      } catch (e) {
        showResult({ ok: false, error: String(e), stderr: String(e) });
      } finally {
        $("publishBtn").disabled = false;
      }
    }

    $("kind").addEventListener("change", () => {
      $("code").value = $("kind").value === "web" ? WEB_SAMPLE : CONSOLE_SAMPLE;
    });
    $("sampleBtn").addEventListener("click", () => {
      $("kind").value = "web";
      $("code").value = WEB_SAMPLE;
    });
    $("runBtn").addEventListener("click", run);
    $("publishBtn").addEventListener("click", publish);
    ping();
  </script>
</body>
</html>
