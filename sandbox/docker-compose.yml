services:
  sandbox:
    build: .
    image: coding-agent-csharp-sandbox:local
    container_name: coding-agent-sandbox
    ports:
      - "8099:8080"
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-ashkandehnavi/n8n-code}
      GITHUB_API: ${GITHUB_API:-https://api.github.com}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
